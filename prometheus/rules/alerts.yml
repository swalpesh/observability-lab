groups:
  - name: orders-api
    rules:
      # 1. The app stopped answering Prometheus at all
      - alert: OrdersApiDown
        expr: up{job="orders-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "orders-api is down"
          description: "Prometheus could not scrape orders-api for over 1 minute."

      # 2. More than 5% of API requests are failing with 5xx errors
      - alert: OrdersApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="orders-api", route=~"/api/.*", status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="orders-api", route=~"/api/.*"}[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "orders-api error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing."

      # 3. The slowest 5% of requests take longer than half a second
      - alert: OrdersApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="orders-api", route=~"/api/.*"}[5m]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "orders-api p95 latency above 500ms"
          description: "95% of requests finish in {{ $value | humanizeDuration }} or more."

      # 4. Blackbox can't get a 2xx answer from a URL
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not responding"
          description: "The uptime check has failed for over 1 minute."