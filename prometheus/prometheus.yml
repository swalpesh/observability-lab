global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8080"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Blackbox: "is this URL answering?" checks
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://orders-api:8080/health
          - http://grafana:3000/api/health
    relabel_configs:
      # 1. Pass the URL to check as ?target=...
      - source_labels: [__address__]
        target_label: __param_target
      # 2. Show the checked URL as the "instance" label
      - source_labels: [__param_target]
        target_label: instance
      # 3. Actually send the request to the blackbox exporter
      - target_label: __address__
        replacement: blackbox:9115