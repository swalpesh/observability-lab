auth_enabled: false          # single user, no login (fine for local)

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1      # one copy, because we run a single Loki
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:              # store logs on disk (in AWS you'd use S3)
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false